<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">QIconPicker logo</title>
  <desc id="desc">A rounded application tile with an icon grid and a highlighted selected icon.</desc>
  <defs>
    <linearGradient id="outer-bg" x1="104" y1="96" x2="920" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9faf5" />
      <stop offset="1" stop-color="#edf1e9" />
    </linearGradient>
    <linearGradient id="frame-bg" x1="112" y1="98" x2="905" y2="926" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dde4dc" />
      <stop offset="1" stop-color="#cfd7ce" />
    </linearGradient>
    <linearGradient id="panel-bg" x1="210" y1="214" x2="824" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f6fa" />
    </linearGradient>
    <linearGradient id="selected-bg" x1="436" y1="428" x2="642" y2="637" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#1976d2" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0b1720" flood-opacity="0.24" />
    </filter>
    <clipPath id="panel-clip">
      <rect x="168" y="138" width="688" height="760" rx="116" />
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#outer-bg)" />
  <rect x="76" y="76" width="872" height="872" rx="190" fill="url(#frame-bg)" />

  <g filter="url(#soft-shadow)">
    <g clip-path="url(#panel-clip)">
      <rect x="168" y="138" width="688" height="760" rx="116" fill="url(#panel-bg)" />
      <rect x="168" y="138" width="688" height="194" fill="#07101d" />
      <circle cx="276" cy="235" r="35" fill="#f7fbff" />
      <circle cx="382" cy="235" r="35" fill="#c5ced6" />
      <circle cx="488" cy="235" r="35" fill="#7e8a94" />
      <rect x="248" y="414" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="248" y="550" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="248" y="686" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="452" y="414" width="120" height="82" rx="22" fill="url(#selected-bg)" />
      <rect x="452" y="550" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="452" y="686" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="656" y="414" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="656" y="550" width="120" height="82" rx="22" fill="#dfe7e3" />
      <rect x="656" y="686" width="120" height="82" rx="22" fill="#dfe7e3" />
    </g>
  </g>

  <path
    fill="#ffffff"
    d="M512 437l21 43 47 7-34 33 8 47-42-22-42 22 8-47-34-33 47-7 21-43z"
  />
  <path
    fill="#07101d"
    d="M637 554l137 307-82-33-41 92-56-25 41-92-79-34 137-68-57-147z"
    opacity="0.92"
  />
  <path
    fill="#11b5e5"
    d="M654 620l83 186-50-20-37 82-25-11 37-83-48-20 83-42-43-92z"
  />
</svg>
